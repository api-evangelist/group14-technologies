identifier_warning: >-
  Every `id` here is a WordPress database primary key. They are unique per site but carry no
  semantics, are not prefixed by type, and collide conceptually across post types and taxonomies
  (Resource 550851 and MediaItem 550851 are different objects in different collections). Resolve and
  cache by `slug`, which is the natural key and is stable in the site's own URLs.
