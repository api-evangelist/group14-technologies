aid: group14-technologies
name: Group14 Technologies
description: >-
  Group14 Technologies is a battery materials manufacturer headquartered in Woodinville, Washington,
  founded in 2015 by Rick Luebbe, Dr. Rick Costantino and Aaron Feaver as a spinout of EnerG2. It
  produces SCC55, a silicon-carbon composite anode material that replaces graphite in lithium-ion
  cells to raise energy density, shorten charge times and extend cycle life for electric mobility,
  grid-scale storage and consumer electronics. Manufacturing runs through its BAM (battery active
  materials) factory network — BAM-1 and the silane factory in Washington State, BAM-2 in Moses
  Lake, and BAM-3 operated by the SK materials Group14 joint venture in Sangju, South Korea — and
  the company reports more than 170 issued patents worldwide. Group14 is a materials manufacturer
  rather than a software vendor: it publishes no developer program, no API documentation, no SDKs
  and no pricing for machine access. The only machine-readable interfaces it exposes are the
  anonymously readable WordPress REST content API behind group14.technology, captured here for
  discovery purposes and read-only without credentials, and a WordPress MCP Adapter endpoint on the
  same host that is registered but authentication-gated.
