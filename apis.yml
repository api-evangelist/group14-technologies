- aid: group14-technologies:group14-technologies-mcp-server
  name: Group14 Technologies MCP Server (gated)
  description: >-
    A WordPress MCP Adapter endpoint registered on group14.technology at
    /wp-json/mcp/mcp-adapter-default-server. The route is real — the namespace `mcp` is declared in
    the site REST index and the endpoint answers POST, GET and DELETE — but every anonymous call,
    including `tools/list`, returns HTTP 401 `rest_forbidden`. This is site-administration
    infrastructure gated to authenticated WordPress users, not a customer-facing agent surface, and
    Group14 publishes no credential issuance path for it. The tool list and input schemas cannot be
    read without authentication and are therefore NOT recorded.
  humanURL: https://group14.technology/wp-json/mcp
  baseURL: https://group14.technology/wp-json/mcp/mcp-adapter-default-server
