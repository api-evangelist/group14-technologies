sla:
  published: false
  detail: No SLA, no uptime commitment, no support commitment for machine access. The API is an unadvertised by-product of the corporate website.
changelog:
  published: false
  detail: >-
    No dated changelog for the API surface. The company does publish dated corporate news and press
    releases through the resource library (169 records, listResources, ordered by date), which is the
    closest thing to a change feed and is editorial rather than technical. No `ChangeLog` pointer is
    emitted.
support:
  api_support_channel: none
  detail: >-
    https://group14.technology/contact-us/ is a corporate contact form for commercial and press
    enquiries. There is no developer support channel, forum, or community. NO `Support` pointer is
    emitted for a developer channel that does not exist.
stability_assessment:
  grade: unmanaged
  detail: >-
    This is a content API behind a marketing site. Content types (`resource`, `location`,
    `job-opening`, `video`) and their ACF field sets can change without notice whenever the site is
    redesigned, and taxonomy term ids are database identifiers, not stable public keys. A consumer
    should resolve by `slug` rather than by numeric `id`, and should expect the shape to drift
    silently. That is a real finding about consuming this surface, not a criticism of the company —
    it never offered it as a product.
