  published: false
  probed:
  - {url: 'https://status.group14.technology/', dns: NXDOMAIN}
  - {url: 'https://group14.technology/status/', status: 404}
  detail: >-
    There is no status page for this surface. NO `StatusPage` pointer is emitted in apis.yml,
