  current_version: wp/v2
  published_policy: false
  detail: >-
    The version is the WordPress REST namespace and is inherited from WordPress core, not chosen or
    governed by Group14. 21 namespaces are registered on this host at capture. A WordPress core
    upgrade is the only thing that would move it, and the site operator does not announce those.
  namespaces_at_capture: 21
  routes_at_capture: 455
