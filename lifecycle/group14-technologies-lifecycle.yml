description: >-
  Group14 Technologies publishes no versioning policy, no deprecation policy, no SLA, no status page
  and no changelog for the machine-readable surface behind group14.technology. This artifact records
  those absences honestly rather than omitting them, and records what the surface's version
  behaviour actually is.
